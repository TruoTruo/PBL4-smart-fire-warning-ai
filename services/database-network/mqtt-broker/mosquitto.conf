# ============================================================
# mosquitto.conf
# Cấu hình Eclipse Mosquitto cho demo/local test
# Chạy: mosquitto -c mosquitto.conf
# hoặc qua docker-compose (xem infra/docker-compose.yml)
# ============================================================

# Cổng lắng nghe mặc định cho MQTT
listener 1883
protocol mqtt

# Cho phép kết nối không cần user/pass (CHỈ dùng cho demo/local)
# Khi triển khai thật, đổi thành "false" và cấu hình password_file
allow_anonymous true

# Ghi log ra file + console để debug khi tích hợp
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information

# Lưu lại message khi broker restart (tránh mất dữ liệu đang chờ xử lý)
persistence true
persistence_location /mosquitto/data/

# ------------------------------------------------------------
# QUY ƯỚC TOPIC (thống nhất với Huy - iot-edge):
#
#   firealert/sensor-data/{device_id}
#       -> Node Pi publish định kỳ (mỗi 5-10s): nhiệt độ, độ ẩm,
#          khí gas, kết quả AI (YOLOv8), confidence score
#
#   firealert/alarm/{device_id}
#       -> Được publish bởi mqtt_subscriber.py (phía DB) SAU KHI
#          đã xác thực kép (AI=true AND cảm biến vượt ngưỡng),
#          để desktop-app subscribe và gọi API gửi SMS
#
#   firealert/status/{device_id}
#       -> (tùy chọn) Last Will and Testament - báo thiết bị
#          online/offline, dùng để cập nhật cột TrangThai
# ------------------------------------------------------------
