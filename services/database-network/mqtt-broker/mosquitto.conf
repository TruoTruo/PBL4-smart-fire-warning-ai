# ============================================================
# mosquitto.conf
# Cấu hình Eclipse Mosquitto cho demo/local test
# Chạy: mosquitto -c mosquitto.conf
# hoặc qua docker-compose (xem infra/docker-compose.yml)
# ============================================================

# Cổng lắng nghe mặc định cho MQTT
listener 1883
protocol mqtt

# Cho phép kết nối không cần user/pass (CHỈ dùng cho demo/local)
# Khi triển khai thật, đổi thành "false" và cấu hình password_file
allow_anonymous true

# Ghi log ra file + console để debug khi tích hợp
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information

# Lưu lại message khi broker restart (tránh mất dữ liệu đang chờ xử lý)
persistence true
persistence_location /mosquitto/data/

# ------------------------------------------------------------
# QUY ƯỚC TOPIC (thống nhất với Huy - iot-edge):
#
#   pbl4/sensors/fire_warning
#       -> Pi (apps/iot-edge/main_iot.py) publish mỗi 2,5 s: nhiet_do, do_am,
#          co_khoi, co_lua, muc_do, kết quả AI (YOLOv11n), confidence,
#          snapshot, khoi_camera, camera_ok
#
#   firealert/sensor-data/{device_id}
#       -> định dạng JSON mới (temperature, alert_level...), mqtt-subscriber cũng nghe
#
#   firealert/alarm/{device_id}
#       -> Được publish bởi mqtt-subscriber (C#, phía DB) SAU KHI
#          đã ghi cảnh báo vào AlertHistory, để web-app nhận
#
#   pbl4/status/{device_id}
#       -> Pi báo "online"/"offline" (retain + Last Will and Testament)
# ------------------------------------------------------------
